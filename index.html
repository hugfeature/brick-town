<style>

osition:relative;min-width:0;border:2px dashed #8ac4c8;background:#c6edef55;border-radius:5px;padding:0;font-size:11px;color:#527b7c}.cell.land{background:#d8c4a0;border:0;color:#907d5c}.cell.filled{background:var(--brick,#eead53);border:1px solid #9b743b;box-shadow:inset 0 -5px #0002,0 3px #6d714450}.cell.filled:before{content:'••';letter-spacing:6px;color:#ffffff88;position:absolute;inset:0;font-size:18px}.cell.mark{outline:3px solid #e5a130;z-index:2}.truck{position:absolute;left:3%;top:48%;width:14%;height:17%;transition:left 1.6s ease-in-out;z-index:3}.truck svg{overflow:visible}.scene-footer{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.tags{display:flex;gap:6px}.tag{padding:5px 8px;background:#f0f3e9;border-radius:7px;color:#61836a;font-size:11px}.panel{background:#fffdf8;border:1px solid var(--line);border-radius:23px;padding:18px;display:flex;flex-direction:column;gap:14px}.resident{display:flex;gap:10px;align-items:center}.avatar{font-size:30px;background:#fae8c5;border-radius:16px;padding:9px}.resident strong{font-size:15px}.resident small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.bubble{background:#f0f3e8;border-radius:4px 17px 17px;padding:14px;line-height:1.7;font-size:14px}.bubble button{border:0;background:transparent;padding:0 4px;font-size:18px}.label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.cargo{display:flex;align-items:center;justify-content:space-between;background:#fff5df;border:1px solid #f0e0b9;border-radius:14px;padding:9px}.cargo button{border:0;background:#fff;border-radius:10px;font-size:24px;width:40px;height:40px}.cargo-count{font-size:23px;font-weight:800}.primary{background:var(--green);color:white;border:0;border-bottom:4px solid #255b47;border-radius:14px;padding:13px;font-weight:700;font-size:16px;min-height:50px}.primary:active{transform:translateY(2px);border-bottom-width:2px}.secondary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;min-height:44px}.toolbox{margin-top:18px;background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:17px}.toolhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:13px}.toolhead strong{font-size:14px}.toolhead span{font-size:12px;color:var(--muted)}.pieces{display:flex;gap:10px}.piece{flex:1;min-width:0;background:#f5f1e7;border:2px solid transparent;border-radius:14px;padding:14px 6px 10px;min-height:90px}.piece.selected{border-color:var(--green);background:#eaf2e8}.brick{height:25px;background:var(--brick);width:var(--w);max-width:90%;margin:5px auto 11px;position:relative;border-radius:4px;box-shadow:inset 0 -5px #0002,0 3px #0001}.brick:before{content:'';position:absolute;left:5px;right:5px;top:-5px;height:7px;background:radial-gradient(ellipse,#ffffff88 60%,transparent 66%) 0 0/18px 7px}.piece small{font-size:11px}.tool-actions{display:flex;gap:8px;margin-top:12px}.tool-actions button{flex:1}.status{margin:16px 0 0;min-height:50px;background:#eeeede;border-radius:15px;padding:13px 16px;font-size:14px;line-height:1.7}.bottom{display:flex;justify-content:space-between;margin-top:19px;gap:12px;align-items:center}.bottom p{font-size:11px;color:var(--muted);margin:0}.nav{display:flex;gap:8px}.nav button{font-size:12px}.overlay{position:fixed;inset:0;background:#263d3766;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.overlay[hidden]{display:none}.modal{background:var(--paper);border-radius:26px;padding:25px;max-width:560px;width:100%;max-height:90vh;overflow:auto;text-align:center;box-shadow:0 20px 70px #19312833}.modal h2{margin:10px 0;font-size:24px}.modal p{font-size:14px;line-height:1.8;color:#637469}.modal .primary{width:100%;margin-top:12px}.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.map-item{border:1px solid var(--line);border-radius:15px;backg <body>
<main class="wrap">
<header><div class="brand"><div class="logo">▦</div><div><h1>积木小镇</h1><div class="eyebrow">LITTLE BUILDERS · 小小工程师</div></div></div><div class="top-actions"><button class="iconbtn" id="sound" aria-label="开启语音" aria-pressed="false">🔇</button><button class="iconbtn" id="mapBtn">🏡 小镇</button></div></header>
<section class="intro"><div><h2 id="levelTitle">第一座小桥</h2><p>动动手，试试看。小镇等着你的好主意。</p></div><span class="chapter" id="chapter"></span></section>
<div class="layout"><div><section class="scene-card"><div class="scene-head"><span class="live">河畔工地</span><span id="sceneGoal">🌉 搭桥 → 📦 送货</span></div><div class="scene" id="scene">
<svg viewBox="0 0 640 365" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="water" width="65" height="30" patternUnits="userSpaceOnUse"><path d="M5 15q12-7 24 0" fill="none" stroke="#a8dee0" stroke-width="3" stroke-linecap="round"/></pattern></defs><rect width="640" height="365" fill="#d9eef0"/><circle cx="494" cy="58" r="27" fill="#ffdd83"/><g fill="#fff" opacity=".8"><rect x="52" y="49" width="85" height="18" rx="9"/><ellipse cx="91" cy="48" rx="23" ry="15"/><rect x="303" y="30" width="68" height="15" rx="8"/></g><path d="M0 155Q80 94 169 143T363 144T640 129V365H0" fill="#bcd8b1"/><path d="M0 190Q90 133 193 179T399 172T640 174V365H0" fill="#9fc79e"/><path d="M186 169Q340 145 451 182L515 365H113Z" fill="#78c4cf"/><path d="M186 169Q340 145 451 182L515 365H113Z" fill="url(#water)"/><path d="M0 240H119M520 240H640" stroke="#e8d9b5" stroke-width="38"/><path d="M0 242H109M530 242H640" stroke="#faf0d8" stroke-width="3" stroke-dasharray="10 12"/><g transform="translate(517 116)"><rect x="0" y="31" width="87" height="68" rx="5" fill="#fff1cb"/><path d="M-9 33L43-4 95 33" fill="#db8468"/><rect x="31" y="57" width="24" height="42" rx="3" fill="#7d9d80"/><rect x="8" y="48" width="16" height="20" rx="3" fill="#96cad1"/><rect x="62" y="48" width="16" height="20" rx="3" fill="#96cad1"/><rect x="19" y="31" width="50" height="16" rx="5" fill="#fffaf0"/><text x="44" y="43" text-anchor="middle" font-size="10" fill="#657264">小镇商店</text></g><g fill="#659866"><circle cx="44" cy="165" r="23"/><circle cx="65" cy="175" r="21"/><circle cx="582" cy="296" r="25"/><circle cx="608" cy="306" r="21"/></g><g fill="#f4d77b"><circle cx="50" cy="305" r="4"/><circle cx="80" cy="320" r="4"/><circle cx="556" cy="337" r="4"/></g><g fill="#fff7dd"><ellipse cx="288" cy="317" rx="12" ry="7"/><circle cx="299" cy="311" r="6"/></g><path d="M304 311h7" stroke="#e9a752" stroke-width="4"/></svg>

<aside class="panel"><div class="resident"><span class="avatar" id="avatar">🐰</span><div><strong id="resident"></strong><small>来自小镇的求助</small></div></div><div class="bubble"><span id="request"></span> <button id="speak" aria-label="朗读任务">🔊</button></div><div class="cargo-wrap"><div class="label"><span>装好货物</span><span id="cargoTarget"></span></div><div class="cargo"><button id="minus" aria-label="减少一个货箱">−</button><span class="cargo-count" id="cargoCount"></span><button id="plus" aria-label="增加一个货箱">+</button></div></div><button class="primary" id="test">🚚 出发，试一试</button><button class="secondary" id="freeBtn">🎨 自由搭建</button></aside></div>

</main><div class="overlay" id="overlay" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="小镇窗口" tabindex="-1"></section></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),colors=['#e9b64e','#da8269','#74a799','#779dc2'];
const levels=[
{title:'第一座小桥',who:'兔子店长',face:'🐰',need:2,gap:[2,3,4],stock:[1,1,0],text:'商店需要 2 箱苹果。先搭一座小桥，再帮我送过来吧！',icon:'🍎'},
{title:'花园要开花啦',who:'小熊园丁',face:'🐻',need:3,gap:[2,3,4,5],stock:[0,2,0],text:'花园需要 3 箱种子。这次试试用两块一样长的积木搭桥。',icon:'🌷'},
{title:'面包店的早餐',who:'小猫面包师',face:'🐱',need:4,gap:[1,2,3,4,5],stock:[0,1,1],text:'请送来 4 箱面粉。长积木和短积木，怎么搭在一起呢？',icon:'🥐'},
{title:'小树的新家',who:'狐狸护林员',face:'🦊',need:2,gap:[1,2,4,5,6],stock:[0,1,1],text:'请送来 2 箱树苗。河中间有一块小岛，两边都要接起来。',icon:'🌳'},
{title:'星光图书馆',who:'猫头鹰馆长',face:'🦉',need:5,gap:[1,2,3,4,5,6],stock:[1,1,2],text:'图书馆需要 5 箱新书。选你喜欢的搭法，不必用完所有积木。',icon:'📚'},
{title:'小镇野餐日',who:'小镇的朋友们',face:'🐼',need:6,gap:[0,1,2,3,4,5,6,7],stock:[2,3,2],text:'送来 6 箱水果，我们一起野餐！宽宽的河也难不倒小工程师。',icon:'🧺'}];
let data={done:[],level:0,free:Array(40).fill(null),sound:false};
try{const d=JSON.parse(localStorage.getItem('brickTownV2'));if(d){data.done=Array.isArray(d.done)?[...new Set(d.done.filter(x=>Number.isInteger(x)&&x>=0&&x<6))]:[];data.level=Number.isInteger(d.level)&&d.level>=0&&d.level<6?d.level:0;data.free=Array.isArray(d.free)&&d.free.length===40?d.free.map(x=>colors.includes(x)?x:null):data.free;data.sound=d.sound===true}}catch(e){}
let idx=data.level,placed=[],selected=1,cargo=0,busy=false,hints=0,freeColor=colors[0],timer=null,lastFocus=null;
function save(){try{localStorage.setItem('brickTownV2',JSON.stringify(data))}catch(e){$('status').textContent='这台设备暂时不能保存进度，本次仍然可以继续玩。'}}
function say(t){if(!data.sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function message(t){$('status').textContent=t;say(t)}
function remaining(n){return levels[idx].stock[n-1]-placed.filter(p=>p.n===n).length}
function covered(i){return placed.some(p=>i>=p.start&&i<p.start+p.n)}
function render(){const l=levels[idx];$('bridge').innerHTML='';for(let i=0;i<8;i++){let b=document.createElement('button');const gap=l.gap.includes(i),p=placed.find(p=>i>=p.start&&i<p.start+p.n);b.className='cell '+(!gap?'land':p?'filled':'');b.textContent=gap&&!p?'＋':'';b.setAttribute('aria-label',`第${i+1}格，${!gap?'岸边':p?'已有积木':'空桥面'}`);if(p)b.style.setProperty('--brick',colors[p.n-1]);b.disabled=busy||!gap;b.onclick=()=>place(i);$('bridge').append(b)}$('pieces').innerHTML='';for(let n=1;n<=3;n++){let b=document.createElement('button');b.className='piece'+(selected===n?' selected':'');b.setAttribute('aria-pressed',selected===n);b.disabled=busy||remaining(n)<=0;b.setAttribute('aria-label',`${n}格长积木，剩余${remaining(n)}块`);b.innerHTML=`<div class="brick" style="--brick:${colors[n-1]};--w:${n*23}px"></div><small>${n} 格长 · ${remaining(n)} 块</small>`;b.onclick=()=>{selected=n;render();message(`选好了 ${n} 格长积木，点一个空格，从那里开始搭。`)};$('pieces').append(b)}$('bridgeCount').textContent=`桥面 ${l.gap.filter(covered).length} / ${l.gap.length} 格已接好`;$('cargoCount').textContent='📦 '+cargo;$('minus').disabled=busy||cargo===0;$('plus').disabled=busy||cargo===9;$('undo').disabled=busy||!placed.length;$('test').disabled=busy;$('hint').disabled=busy;$('mapBtn').disabled=busy;$('freeBtn').disabled=busy;$('rest').disabled=busy;$('parent').disabled=busy;}
function start(i){clearTimeout(timer);idx=i;data.level=i;placed=[];cargo=0;busy=false;hints=0;selected=levels[i].stock.findIndex(n=>n>0)+1;$('truck').style.transition='none';$('truck').style.left='3%';const l=levels[i];$('levelTitle').textContent=l.title;$('chapter').textContent=`任务 ${i+1} / 6`;$('resident').textContent=l.who;$('avatar').textContent=l.face;$('request').textContent=l.text;$('cargoTarget').textContent=`需要 ${l.need} 箱`;$('sound').textContent=data.sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',data.sound);$('sound').setAttribute('aria-label',data.sound?'关闭语音':'开启语音');render();message('先看看河上缺了几格，再选一块积木。');save()}
function place(i){if(busy)return;if(covered(i)){message('这块已经搭好了。想换一种搭法，可以点“拆回一块”。');return}if(remaining(selected)<=0){message('这种积木用完了，选另一种，或者拆回一块。');return}for(let j=i;j<i+selected;j++){if(j>7||!levels[idx].gap.includes(j)||covered(j)){message('这块积木放不下：需要连续的空格。试试换个起点或短一点的积木。');return}}placed.push({start:i,n:selected});render();message('咔哒，接好啦！你可以继续搭，也可以先试着开车。')}
function open(html){lastFocus=document.activeElement;$('modal').innerHTML=html;$('overlay').hidden=false;$('modal').focus()}
function close(){if('speechSynthesis'in window)speechSynthesis.cancel();$('overlay').hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function run(){if(busy)return;busy=true;render();const l=levels[idx],hole=l.gap.find(i=>!covered(i));$('truck').style.transition='left 1.6s ease-in-out';$('truck').style.left=hole===undefined?'82%':Math.max(3,18+hole*8-12)+'%';message(hole===undefined?'桥接起来了，小车出发！':'小车慢慢检查桥面……');timer=setTimeout(()=>{busy=false;render();if(hole!==undefined){$('bridge').children[hole].classList.add('mark');message(`小车停在缺口前了。亮起来的地方还没有桥面，补好再试试。`);return}if(cargo!==l.need){message(cargo<l.need?`到了！不过还少 ${l.need-cargo} 箱货物。加好货，再出发。`:`到了！多装了 ${cargo-l.need} 箱，卸下多余的货物再送来吧。`);$('truck').style.left='3%';return}if(!data.done.includes(idx))data.done.push(idx);save();const fx=document.createElement('div');fx.className='confetti';$('scene').append(fx);setTimeout(()=>fx.remove(),1200);open(`<div class="success-icon">${l.icon}</div><div class="eyebrow">小镇因为你，有了新变化</div><h2>${l.title}，完成！</h2><p>你接好了 ${l.gap.length} 格桥面，送来了 ${l.need} 箱货物。<br>想一想：换一种积木，还能搭出来吗？</p><button class="primary" id="next">${idx===5?'🏡 看看我的小镇':'下一位朋友在等你 →'}</button><button class="secondary" id="stop" style="margin-top:10px;width:100%">今天先到这里 🌙</button>`);$('next').onclick=()=>{close();if(idx<5)start(idx+1);else showMap()};$('stop').onclick=rest;say('成功送到了！谢谢你，小工程师。')},1700)}
function hint(){hints++;const l=levels[idx],hole=l.gap.find(i=>!covered(i));if(hole===undefined){message(`桥已经连起来啦。数一数，车上是不是正好有 ${l.need} 箱货物？`);return}if(hints===1){message('从左往右找一找：哪里还有空格？相邻的空格，可以用一块长积木接起来。');return}let found=null;for(let n=3;n>=1;n--)if(remaining(n)>0&&Array.from({length:n},(_,j)=>hole+j).every(j=>l.gap.includes(j)&&!covered(j))) {found=n;break}if(found){selected=found;render();$('bridge').children[hole].classList.add('mark');message(`试试这块 ${found} 格长积木，从亮起来的空格开始放。`)}else message('剩下的积木暂时放不进这个缺口。拆回一块，试试调整顺序。')}
function showMap(){open(`<div class="success-icon">🏡</div><h2>我们一起建的小镇</h2><p>已经帮助了 ${data.done.length} 位朋友。点一个地方，随时再去玩。</p><div class="map-grid">${levels.map((l,i)=>`<button class="map-item" data-level="${i}"><span>${data.done.includes(i)?l.icon:'🌱'}</span><small>${l.title}<br>${data.done.includes(i)?'✓ 已点亮':'去帮忙'}</small></button>`).join('')}</div><button class="secondary" id="back">回到工地</button>`);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{close();start(Number(b.dataset.level))});$('back').onclick=close}
function rest(){open('<div class="success-icon">🌙</div><h2>小镇休息啦</h2><p>完成的任务和自由作品已经记住了。<br>这座还没搭完的桥，下次可以重新挑战。<br>也可以找找家里的积木，搭一座让玩具车通过的桥。</p><button class="primary" id="back">回到游戏</button>');$('back').onclick=close}
function free(){open('<div class="eyebrow">没有标准答案的小工坊</div><h2>你想造什么？</h2><p>选颜色，点格子搭积木；用橡皮擦拆掉。作品自动保存。</p><div class="palette" id="palette"></div><div class="free-grid" id="freeGrid"></div><button class="primary" id="back">收好作品，回到小镇</button>');function draw(){ $('palette').innerHTML='';[...colors,null].forEach(c=>{let b=document.createElement('button');b.className='swatch'+(freeColor===c?' selected':'');b.style.background=c||'#fff';b.textContent=c?'':'⌫';b.setAttribute('aria-label',c?['黄色','红色','绿色','蓝色'][colors.indexOf(c)]+'积木':'橡皮擦');b.setAttribute('aria-pressed',freeColor===c);b.onclick=()=>{freeColor=c;draw()};$('palette').append(b)});$('freeGrid').innerHTML='';data.free.forEach((c,i)=>{let b=document.createElement('button');b.className='free-cell';if(c){b.style.background=c;b.style.boxShadow='inset 0 -4px #0002';b.textContent='••'}b.setAttribute('aria-label',`第${Math.floor(i/8)+1}行，第${i%8+1}列，${c?'有积木':'空白'}`);b.onclick=()=>{data.free[i]=freeColor;save();draw()};$('freeGrid').append(b)})}draw();$('back').onclick=close}
$('undo').onclick=()=>{if(busy)return;placed.pop();render();message('拆回来了。换个位置或长度，再试一次。')};$('hint').onclick=hint;$('test').onclick=run;$('minus').onclick=()=>{if(!busy&&cargo>0){cargo--;render()}};$('plus').onclick=()=>{if(!busy&&cargo<9){cargo++;render()}};$('mapBtn').onclick=showMap;$('freeBtn').onclick=free;$('rest').onclick=rest;$('speak').onclick=()=>{data.sound=true;updateSound();say(levels[idx].text)};
function updateSound(){$('sound').textContent=data.sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',data.sound);$('sound').setAttribute('aria-label',data.sound?'关闭语音':'开启语音');save()}
$('sound').onclick=()=>{data.sound=!data.sound;updateSound();if(data.sound){if(!('speechSynthesis'in window))message('这个浏览器暂不支持语音，可以看图和文字继续玩。');else say(levels[idx].text)}else if('speechSynthesis'in window)speechSynthesis.cancel()};
$('parent').onclick=()=>{open('<h2>陪他试，不急着告诉答案</h2><p style="text-align:left">适合约 5—7 岁，在成人陪伴下开始。<br><br>可以问：“你觉得哪里还没接好？”“为什么这块放不下？”让孩子先预测，再试车，然后修改。<br><br>这里提供空间组合、数量对应和尝试改进的练习机会，不代表已经测量或保证能力提升。建议一次玩 1—2 个任务，再用真实积木复现。<br><br>没有广告、付费或签到。进度只保存在当前浏览器，清除网站数据会丢失；语音是否可用取决于设备的中文语音支持。</p><button class="primary" id="back">知道了</button>');$('back').onclick=close};
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const a=[...$('modal').querySelectorAll('button:not(:disabled)')];if(!a.length)return;const first=a[0],last=a[a.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('modal'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('modal'))){e.preventDefault();first.focus()}}});start(idx);
})();
</script></body></html>
